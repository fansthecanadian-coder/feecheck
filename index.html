<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FeeCheck — Marketplace Profit Calculator</title><meta name="description" content="Free marketplace profit calculator. See your real profit after fees, item cost and shipping."><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#171923}.wrap{max-width:820px;margin:auto;padding:32px 18px 60px}.card{background:#fff;border:1px solid #e4e6ed;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(20,25,40,.06)}h1{font-size:42px;margin:0 0 8px;letter-spacing:-1.5px}.sub{color:#5f6472;font-size:17px;margin-bottom:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:34px}}label{display:block;font-weight:650;font-size:14px;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #ccd0da;border-radius:10px;font-size:16px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:#171923;color:white;font-size:16px;font-weight:700;cursor:pointer}.result{margin-top:20px;padding:20px;border-radius:14px;background:#f0f3ff}.big{font-size:36px;font-weight:800}.muted{color:#666d7b}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #dfe3ef}.row:last-child{border:0}.note{font-size:13px;color:#727887;margin-top:16px;line-height:1.5}footer{text-align:center;color:#747987;font-size:13px;margin-top:24px}</style></head><body><div class="wrap"><div class="card"><h1>FeeCheck</h1><div class="sub">Know your real profit before you list.</div><div class="grid"><div><label>Sale price</label><input id="price" type="number" min="0" step=".01" value="100"></div><div><label>Item cost</label><input id="cost" type="number" min="0" step=".01" value="40"></div><div><label>Shipping charged to buyer</label><input id="shipIn" type="number" min="0" step=".01" value="0"></div><div><label>Your shipping cost</label><input id="shipOut" type="number" min="0" step=".01" value="8"></div><div><label>Marketplace fee %</label><input id="fee" type="number" min="0" step=".01" value="13"></div><div><label>Fixed fee</label><input id="fixed" type="number" min="0" step=".01" value=".40"></div></div><button onclick="calc()">Calculate my profit</button><div class="result" id="result"></div><div class="note">This is a general calculator. Marketplace fees vary by platform, category, location and seller status. Verify the current fee schedule before making a pricing decision.</div></div><footer>FeeCheck • Free marketplace profit calculator</footer></div><script>function n(id){return parseFloat(document.getElementById(id).value)||0}function money(x){return new Intl.NumberFormat(undefined,{style:'currency',currency:'USD'}).format(x)}function calc(){const price=n('price'),cost=n('cost'),shipIn=n('shipIn'),shipOut=n('shipOut'),fee=n('fee')/100,fixed=n('fixed');const gross=price+shipIn,marketplace=gross*fee+fixed,profit=gross-marketplace-cost-shipOut,margin=gross?profit/gross*100:0;document.getElementById('result').innerHTML='<div class="muted">Estimated profit</div><div class="big">'+money(profit)+'</div><div class="row"><span>Customer pays</span><b>'+money(gross)+'</b></div><div class="row"><span>Marketplace fees</span><b>−'+money(marketplace)+'</b></div><div class="row"><span>Item + shipping cost</span><b>−'+money(cost+shipOut)+'</b></div><div class="row"><span>Profit margin</span><b>'+margin.toFixed(1)+'%</b></div>'}calc()</script></body></html>
